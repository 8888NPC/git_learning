server:
  port: 8080

spring:
  application:
    name: java-task-list
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/task_api?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql

springdoc:
  swagger-ui:
    path: /developer/swagger-ui.html
  api-docs:
    path: /developer/openapi.json

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
